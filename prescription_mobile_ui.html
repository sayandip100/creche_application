<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescription Generator - Mobile UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .mobile-container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 900px;
        }

        .mobile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .mobile-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .mobile-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .mobile-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .section-title {
            font-weight: 700;
            color: #667eea;
            margin-top: 25px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            font-size: 15px;
        }

        .medicine-item {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .medicine-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .medicine-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .medicine-remove {
            background: #ff4757;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .medicine-remove:hover {
            background: #ff3838;
        }

        .medicine-qty {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .qty-btn:hover {
            background: #5568d3;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            padding: 6px !important;
        }

        .add-medicine-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .add-medicine-btn:hover {
            background: #26a85c;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .toggle-label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: #ddd;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #2ed573;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }

        .toggle-switch.active::after {
            left: 24px;
        }

        .mobile-footer {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #f9f9f9;
            display: flex;
            gap: 10px;
        }

        .btn-cancel {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            border-color: #999;
        }

        .btn-submit {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 5px;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .mobile-container {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }

        .spinner {
            display: none;
            margin-right: 8px;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="mobile-header">
            <h1>💊 Generate Prescription</h1>
            <p>Fill in the details to create a prescription</p>
        </div>

        <!-- Content -->
        <div class="mobile-content">
            <div id="alertContainer"></div>

            <form id="prescriptionForm">
                <!-- Health Center Selection -->
                <div class="form-group">
                    <label for="healthCenter">Health Center <span style="color: #ff4757;">*</span></label>
                    <select id="healthCenter" name="health_center_id" required>
                        <option value="">-- Select Health Center --</option>
                        <option value="1">Health Center 1 (Main)</option>
                        <option value="2">Health Center 2 (Branch A)</option>
                        <option value="3">Health Center 3 (Branch B)</option>
                    </select>
                </div>

                <!-- Nurse Selection -->
                <div class="form-group">
                    <label for="nurse">Head Nurse <span style="color: #ff4757;">*</span></label>
                    <select id="nurse" name="nurse_id" required>
                        <option value="">-- Select Nurse --</option>
                        <option value="1">hn1 (Head Nurse)</option>
                        <option value="2">Sarah Johnson (Head Nurse)</option>
                        <option value="3">Maria Garcia (Nurse)</option>
                    </select>
                </div>

                <!-- Doctor Selection -->
                <div class="form-group">
                    <label for="doctor">Doctor <span style="color: #ff4757;">*</span></label>
                    <select id="doctor" name="doctor_id" required>
                        <option value="">-- Select Doctor --</option>
                        <option value="9">bhh (Specialization: hhh)</option>
                        <option value="2">Dr. John Smith (Cardiologist)</option>
                        <option value="3">Dr. Emily Brown (Pediatrician)</option>
                    </select>
                </div>

                <!-- Patient Treatment -->
                <div class="form-group">
                    <label for="treatment">Patient Treatment Record <span style="color: #ff4757;">*</span></label>
                    <select id="treatment" name="patient_treatment_id" required>
                        <option value="">-- Select Treatment --</option>
                        <option value="13">viku - Age: 52 - Fever</option>
                        <option value="14">Rajesh - Age: 45 - Cough</option>
                        <option value="15">Priya - Age: 28 - Headache</option>
                    </select>
                </div>

                <!-- Medicines Section -->
                <div class="section-title">🔬 Add Medicines</div>

                <div class="form-group">
                    <label for="medicineSelect">Select Medicine to Add</label>
                    <select id="medicineSelect">
                        <option value="">-- Select Medicine --</option>
                        <option value="1">Medicine 1 (MED001)</option>
                        <option value="2">Medicine 2 (MED002)</option>
                        <option value="3">Paracetamol (MED003)</option>
                        <option value="4">Aspirin (MED004)</option>
                        <option value="5">Amoxicillin (MED005)</option>
                    </select>
                </div>

                <button type="button" class="add-medicine-btn" onclick="addMedicine()">+ Add Medicine</button>

                <div id="medicinesContainer">
                    <!-- Medicines will be added here -->
                </div>

                <!-- Send WhatsApp Toggle -->
                <div class="section-title">📱 Notification</div>

                <div class="toggle-group">
                    <span class="toggle-label">Send via WhatsApp</span>
                    <div class="toggle-switch active" id="whatsappToggle" onclick="toggleWhatsApp()"></div>
                </div>

                <input type="hidden" id="sendWhatsapp" name="send_whatsapp" value="true">
            </form>
        </div>

        <!-- Footer -->
        <div class="mobile-footer">
            <button class="btn-cancel" onclick="resetForm()">Reset</button>
            <button class="btn-submit" id="submitBtn" onclick="submitForm()">
                <span class="spinner"></span>Generate Prescription
            </button>
        </div>
    </div>

    <script>
        let selectedMedicines = {};

        // Sample data - would come from API in real app
        const medicinesList = {
            '1': { id: 1, name: 'Medicine 1', code: 'MED001', stock: 15 },
            '2': { id: 2, name: 'Medicine 2', code: 'MED002', stock: 39 },
            '3': { id: 3, name: 'Paracetamol', code: 'MED003', stock: 100 },
            '4': { id: 4, name: 'Aspirin', code: 'MED004', stock: 50 },
            '5': { id: 5, name: 'Amoxicillin', code: 'MED005', stock: 25 }
        };

        function addMedicine() {
            const medicineId = document.getElementById('medicineSelect').value;
            
            if (!medicineId) {
                showAlert('Please select a medicine', 'error');
                return;
            }

            if (selectedMedicines[medicineId]) {
                showAlert('This medicine is already added', 'error');
                return;
            }

            const medicine = medicinesList[medicineId];
            selectedMedicines[medicineId] = { ...medicine, quantity: 1 };
            
            document.getElementById('medicineSelect').value = '';
            renderMedicines();
        }

        function removeMedicine(medicineId) {
            delete selectedMedicines[medicineId];
            renderMedicines();
        }

        function updateQuantity(medicineId, change) {
            if (selectedMedicines[medicineId]) {
                const newQty = selectedMedicines[medicineId].quantity + change;
                if (newQty > 0) {
                    selectedMedicines[medicineId].quantity = newQty;
                    renderMedicines();
                }
            }
        }

        function renderMedicines() {
            const container = document.getElementById('medicinesContainer');
            
            if (Object.keys(selectedMedicines).length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💊</div>
                        <p>No medicines added yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = Object.entries(selectedMedicines).map(([id, med]) => `
                <div class="medicine-item">
                    <div class="medicine-item-header">
                        <div>
                            <div class="medicine-name">${med.name}</div>
                            <div style="font-size: 12px; color: #999;">Stock: ${med.stock} units</div>
                        </div>
                        <button type="button" class="medicine-remove" onclick="removeMedicine('${id}')">Remove</button>
                    </div>
                    <div class="medicine-qty">
                        <button type="button" class="qty-btn" onclick="updateQuantity('${id}', -1)">−</button>
                        <input type="number" class="qty-input" value="${med.quantity}" readonly>
                        <button type="button" class="qty-btn" onclick="updateQuantity('${id}', 1)">+</button>
                        <span style="margin-left: 10px; font-size: 12px; color: #666;">Qty: ${med.quantity}</span>
                    </div>
                </div>
            `).join('');
        }

        function toggleWhatsApp() {
            const toggle = document.getElementById('whatsappToggle');
            const input = document.getElementById('sendWhatsapp');
            
            toggle.classList.toggle('active');
            input.value = toggle.classList.contains('active') ? 'true' : 'false';
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            container.innerHTML = '';
            container.appendChild(alertDiv);

            setTimeout(() => alertDiv.remove(), 3000);
        }

        function resetForm() {
            document.getElementById('prescriptionForm').reset();
            selectedMedicines = {};
            renderMedicines();
            document.getElementById('whatsappToggle').classList.add('active');
            document.getElementById('sendWhatsapp').value = 'true';
        }

        async function submitForm() {
            // Validation
            const healthCenterId = document.getElementById('healthCenter').value;
            const nurseId = document.getElementById('nurse').value;
            const doctorId = document.getElementById('doctor').value;
            const treatmentId = document.getElementById('treatment').value;

            if (!healthCenterId || !nurseId || !doctorId || !treatmentId) {
                showAlert('Please fill all required fields', 'error');
                return;
            }

            if (Object.keys(selectedMedicines).length === 0) {
                showAlert('Please add at least one medicine', 'error');
                return;
            }

            // Prepare API request
            const medicines = Object.values(selectedMedicines).map(med => ({
                medicine_id: med.id,
                quantity: med.quantity
            }));

            const requestData = {
                health_center_id: parseInt(healthCenterId),
                nurse_id: parseInt(nurseId),
                doctor_id: parseInt(doctorId),
                patient_treatment_id: parseInt(treatmentId),
                medicines: medicines,
                send_whatsapp: document.getElementById('sendWhatsapp').value === 'true'
            };

            console.log('Request Data:', JSON.stringify(requestData, null, 2));

            // Show loading state
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                // Make API call
                const response = await fetch('http://45.64.107.97/prescription/generate/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer YOUR_TOKEN_HERE' // Add your auth token
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (response.ok && result.data.prescription_url) {
                    showAlert(`✓ Prescription generated successfully!\nID: ${result.data.prescription_id}`, 'success');
                    console.log('Prescription URL:', result.data.prescription_url);
                    
                    // Auto-reset form
                    setTimeout(() => resetForm(), 2000);
                } else {
                    showAlert(`Error: ${result.message || 'Failed to generate prescription'}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert(`Error: ${error.message}`, 'error');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        }

        // Initialize
        renderMedicines();
    </script>
</body>
</html>
