openapi: 3.0.0
info:
  title: Creche App API
  description: |
    Complete API documentation for the Creche App - covering authentication,
    attendance, reports, health center management, prescriptions, and more.
  version: 1.0.0
  contact:
    name: Creche App Team

servers:
  - url: http://localhost:8000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        status_code:
          type: integer
        message:
          type: string
        data:
          type: object

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access:
          type: string
        data:
          type: object

    MobileLoginResponse:
      type: object
      properties:
        status_code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
            expires_in:
              type: integer
            user_data:
              type: object

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RefreshTokenResponse:
      type: object
      properties:
        status_code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string

    RegisterAttendantRequest:
      type: object
      required:
        - username
        - password
        - role
        - attendant_name
        - tea_garden_id
        - creche_id
        - photo
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [attendant, super_attendant]
        attendant_name:
          type: string
        mobile_no:
          type: string
        address:
          type: string
        tea_garden_id:
          type: integer
        creche_id:
          type: integer
        photo:
          type: string
          format: binary

    RegisterDoctorRequest:
      type: object
      required:
        - username
        - password
        - role
        - doctor_name
        - tea_garden_id
        - health_center_id
        - photo
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [doctor]
        doctor_name:
          type: string
        specialization:
          type: string
        qualification:
          type: string
        mobile_no:
          type: string
        tea_garden_id:
          type: integer
        health_center_id:
          type: integer
        photo:
          type: string
          format: binary

    RegisterNurseRequest:
      type: object
      required:
        - username
        - password
        - role
        - nurse_name
        - tea_garden_id
        - health_center_id
        - photo
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [nurse, head_nurse]
        nurse_name:
          type: string
        qualification:
          type: string
        mobile_no:
          type: string
        tea_garden_id:
          type: integer
        health_center_id:
          type: integer
        photo:
          type: string
          format: binary

    RegisterChildRequest:
      type: object
      required:
        - creche_id
        - name
        - photos
      properties:
        creche_id:
          type: integer
        name:
          type: string
        photos:
          type: array
          items:
            type: string
            format: binary
        photo:
          type: string
          format: binary
        age_years:
          type: integer
        gender:
          type: string
          enum: [M, F]
        height_cm:
          type: number
        weight_kg:
          type: number
        guardian_name:
          type: string
        contact_person_name:
          type: string
        contact_phone:
          type: string
        address:
          type: string

    ChildListRequest:
      type: object
      required:
        - tea_garden_id
      properties:
        tea_garden_id:
          type: integer
        creche_id:
          type: integer

    CreateCrecheRequest:
      type: object
      required:
        - creche_name
        - creche_code
        - tea_garden_id
      properties:
        creche_name:
          type: string
        creche_code:
          type: string
        tea_garden_id:
          type: integer
        location:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        geo_radius_meters:
          type: number

    ChildAttendanceReportRequest:
      type: object
      required:
        - tea_garden_id
        - creche_id
        - end_date
      properties:
        tea_garden_id:
          type: integer
        creche_id:
          type: integer
        end_date:
          type: string
          format: date
        report_format:
          type: string
          enum: [datewise, childwise]
          default: datewise

    FoodMonitoringReportRequest:
      type: object
      required:
        - tea_garden_id
        - creche_id
        - start_date
        - end_date
        - entered_by_id
      properties:
        tea_garden_id:
          type: integer
        creche_id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        entered_by_id:
          type: integer

    StoreFoodMonitoringRequest:
      type: object
      required:
        - food_image
        - creche_id
      properties:
        food_image:
          type: string
          format: binary
        creche_id:
          type: integer
        meal_type:
          type: string
          default: Lunch
        food_date:
          type: string
          format: date
        entered_by_id:
          type: integer

    FoodRecordCreateRequest:
      type: object
      required:
        - creche_id
        - food_items
      properties:
        creche_id:
          type: integer
        food_items:
          type: array
          items:
            type: string
        food_time:
          type: string
          enum: [breakfast, lunch, dinner]
        added_by_id:
          type: integer

    FoodRecordAttendentUpdateRequest:
      type: object
      required:
        - creche_id
        - food_items
      properties:
        creche_id:
          type: integer
        food_items:
          type: array
          items:
            type: string
        reason:
          type: string
        added_by_id:
          type: integer
        food_time:
          type: string
          enum: [breakfast, lunch, dinner]

    FoodRecordAttendentListRequest:
      type: object
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        creche_id:
          type: integer
        food_time:
          type: string
          enum: [breakfast, lunch, dinner]

    TeaGardenIdRequest:
      type: object
      required:
        - tea_garden_id
      properties:
        tea_garden_id:
          type: integer

    AttendantAttendanceReportRequest:
      type: object
      required:
        - tea_garden_id
        - creche_id
        - start_date
        - end_date
      properties:
        tea_garden_id:
          type: integer
        creche_id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    CrecheChildDetailsRequest:
      type: object
      required:
        - creche_id
        - child_id
      properties:
        creche_id:
          type: integer
        child_id:
          type: integer

    AttendantDetailsRequest:
      type: object
      required:
        - creche_id
        - attendant_id
      properties:
        creche_id:
          type: integer
        attendant_id:
          type: integer

    CrecheDetailsRequest:
      type: object
      required:
        - tea_garden_id
        - creche_id
      properties:
        tea_garden_id:
          type: integer
        creche_id:
          type: integer

    HealthCenterDetailsRequest:
      type: object
      required:
        - teagarden_id
        - healthcenter_id
      properties:
        teagarden_id:
          type: integer
        healthcenter_id:
          type: integer

    MarkAttendanceRequest:
      type: object
      required:
        - file
        - creche_id
        - marked_by_id
      properties:
        file:
          type: string
          format: binary
        creche_id:
          type: integer
        marked_by_id:
          type: integer

    MarkIndividualAttendanceRequest:
      type: object
      required:
        - child_id
      properties:
        child_id:
          oneOf:
            - type: integer
            - type: array
              items:
                type: integer
        creche_id:
          type: integer
        attendance_status:
          type: string
          enum: [PRESENT, ABSENT]
          default: PRESENT
        marked_by_id:
          type: integer

    DetectChildrenRequest:
      type: object
      required:
        - file
        - creche_id
      properties:
        file:
          type: string
          format: binary
        creche_id:
          type: integer
        marked_by_id:
          type: integer

    ChildGrowthCreateRequest:
      type: object
      required:
        - child_id
      properties:
        child_id:
          type: integer
        height_cm:
          type: number
        weight_kg:
          type: number
        notes:
          type: string
        weight_pic:
          type: string
          format: binary
        height_pic:
          type: string
          format: binary

    AddPatientRequest:
      type: object
      required:
        - patient_name
        - health_center_id
      properties:
        patient_name:
          type: string
        age:
          type: integer
        contact_number:
          type: string
        health_center_id:
          type: integer
        nurse_id:
          type: integer
        doctor_id:
          type: integer
        status:
          type: integer
          default: 1
        remarks:
          type: string

    PatientListRequest:
      type: object
      properties:
        health_center_id:
          type: integer
        nurse_id:
          type: integer
        doctor_id:
          type: integer

    UpdatePatientRequest:
      type: object
      properties:
        patient_name:
          type: string
        age:
          type: integer
        contact_number:
          type: string
        status:
          type: integer
        remarks:
          type: string
        nurse_id:
          type: integer
        doctor_id:
          type: integer

    DoctorCheckInRequest:
      type: object
      required:
        - photo
        - latitude
        - longitude
        - health_center_id
      properties:
        photo:
          type: string
          format: binary
        latitude:
          type: number
        longitude:
          type: number
        health_center_id:
          type: integer
        attendance_date:
          type: string
          format: date
        nurse_present:
          type: boolean
        hygiene_maintained:
          type: boolean
        patients_visited_today:
          type: integer

    DoctorCheckOutRequest:
      type: object
      required:
        - check_in_id
        - photo
        - latitude
        - longitude
      properties:
        check_in_id:
          type: integer
        photo:
          type: string
          format: binary
        latitude:
          type: number
        longitude:
          type: number
        nurse_present:
          type: boolean
        hygiene_maintained:
          type: boolean
        patients_visited_today:
          type: integer

    DoctorListRequest:
      type: object
      required:
        - health_center_id
      properties:
        health_center_id:
          type: integer
        is_active:
          type: boolean

    GeneratePrescriptionRequest:
      type: object
      required:
        - health_center_id
        - nurse_id
        - doctor_id
        - patient_treatment_id
        - medicines
        - doctor_remarks
        - doctor_prescription_image
      properties:
        health_center_id:
          type: integer
        nurse_id:
          type: integer
        doctor_id:
          type: integer
        patient_treatment_id:
          type: integer
        medicines:
          type: string
          description: JSON array string of medicine IDs and quantities
        doctor_remarks:
          type: string
        doctor_prescription_image:
          type: string
          format: binary
        send_whatsapp:
          type: boolean
          default: true

    MedicineListRequest:
      type: object
      required:
        - health_center_id
      properties:
        health_center_id:
          type: integer

    MedicineEntryRequest:
      type: object
      required:
        - health_center_id
        - nurse_id
        - medicines
      properties:
        health_center_id:
          type: integer
        nurse_id:
          type: integer
        requisition_week_start:
          type: string
          format: date
        requisition_week_end:
          type: string
          format: date
        medicines:
          type: array
          items:
            type: object
            properties:
              medicine_id:
                type: integer
              medicine_name:
                type: string
              received_qty:
                type: integer
              requested_qty:
                type: integer
              unit_name:
                type: string
              min_stock_level:
                type: integer
              remarks:
                type: string

    MedicineUnitCreateRequest:
      type: object
      required:
        - unit_name
      properties:
        unit_name:
          type: string

    MedicineMinStockUpdateRequest:
      type: object
      properties:
        medicine_id:
          type: integer
        medicine_name:
          type: string
        medicine_code:
          type: string
        unit_name:
          type: string
        min_stock_level:
          type: integer
        medicines:
          type: array
          items:
            type: object
            properties:
              medicine_id:
                type: integer
              medicine_name:
                type: string
              medicine_code:
                type: string
              unit_name:
                type: string
              min_stock_level:
                type: integer

    MedicineRequisitionCreateRequest:
      type: object
      required:
        - health_center_id
        - nurse_id
        - medicines
      properties:
        health_center_id:
          type: integer
        nurse_id:
          type: integer
        requisition_week_start:
          type: string
          format: date
        requisition_week_end:
          type: string
          format: date
        medicines:
          type: array
          items:
            type: object
            properties:
              medicine_id:
                type: integer
              medicine_name:
                type: string
              requested_qty:
                type: integer
              unit_name:
                type: string
              min_stock_level:
                type: integer
              remarks:
                type: string
        remarks:
          type: string

    MedicineRequisitionListRequest:
      type: object
      required:
        - health_center_id
      properties:
        health_center_id:
          type: integer
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, FULFILLED]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    MedicineRequisitionDetailRequest:
      type: object
      required:
        - requisition_id
      properties:
        requisition_id:
          type: integer

    MedicineRequisitionStatusUpdateRequest:
      type: object
      required:
        - requisition_id
        - status
      properties:
        requisition_id:
          type: integer
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, FULFILLED]
        remarks:
          type: string

    CheckInRequest:
      type: object
      required:
        - file
        - latitude
        - longitude
      properties:
        file:
          type: string
          format: binary
        latitude:
          type: number
        longitude:
          type: number
        creche_id:
          type: integer
          description: Required for attendant/super_attendant
        health_center_id:
          type: integer
          description: Required for nurse/head_nurse

    AttendantListRequest:
      type: object
      required:
        - tea_garden_id
      properties:
        tea_garden_id:
          type: integer
        creche_id:
          type: integer

    NurseListRequest:
      type: object
      required:
        - tea_garden_id
      properties:
        tea_garden_id:
          type: integer
        health_center_id:
          type: integer

    PromoteToSuperRequest:
      type: object
      properties:
        attendant_id:
          type: integer
        nurse_id:
          type: integer

paths:
  # ============================================
  # AUTHENTICATION
  # ============================================
  /login/:
    post:
      tags: [Authentication]
      summary: Login
      description: Authenticate user and get JWT access token with role-based data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /mobile-login/:
    post:
      tags: [Authentication]
      summary: Mobile Login
      description: Simplified login for mobile clients with role-specific IDs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileLoginResponse'

  /getrefreshtoken/:
    post:
      tags: [Authentication]
      summary: Get Refresh Token
      description: Refresh an expired access token using a valid refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Invalid token type or missing refresh_token
        '401':
          description: Invalid or expired refresh token

  /logout/:
    post:
      tags: [Authentication]
      summary: Logout
      description: Stateless JWT logout - client should delete stored tokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out

  /register/:
    post:
      tags: [Authentication]
      summary: Register Attendant / Doctor / Nurse
      description: Register a new user with photo for face embedding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegisterAttendantRequest'
                - $ref: '#/components/schemas/RegisterDoctorRequest'
                - $ref: '#/components/schemas/RegisterNurseRequest'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error or embedding generation failed

  /childrenregister/:
    post:
      tags: [Authentication]
      summary: Register Child
      description: Register a new child with photos for face embedding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterChildRequest'
      responses:
        '200':
          description: Child registered successfully
        '400':
          description: Validation error or embedding generation failed

  /children/list/:
    post:
      tags: [Authentication]
      summary: Child List
      description: List children by tea garden and optionally creche
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildListRequest'
      responses:
        '200':
          description: Children retrieved successfully

  /creches/create/:
    post:
      tags: [Authentication]
      summary: Create Creche
      description: Create a new creche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCrecheRequest'
      responses:
        '201':
          description: Creche created successfully

  # ============================================
  # REPORTS
  # ============================================
  /reports/child-attendance/:
    post:
      tags: [Reports]
      summary: Child Attendance Report
      description: Get child attendance report (datewise or childwise)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildAttendanceReportRequest'
      responses:
        '200':
          description: Report generated successfully
        '400':
          description: Missing required fields or invalid date format
        '404':
          description: Invalid tea garden or creche

  /reports/food-monitoring/:
    post:
      tags: [Reports]
      summary: Food Monitoring Report
      description: Get food monitoring report with nutrition grading and insights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodMonitoringReportRequest'
      responses:
        '200':
          description: Report generated successfully
        '400':
          description: Missing required fields or invalid date format
        '404':
          description: Invalid creche or tea garden

  /reports/food-monitoring/store/:
    post:
      tags: [Reports]
      summary: Store Food Monitoring
      description: Store food monitoring data by calling external API
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreFoodMonitoringRequest'
      responses:
        '200':
          description: Food monitoring data stored successfully
        '409':
          description: Food monitoring data already exists for this date/meal

  /food-record/create/:
    post:
      tags: [Reports]
      summary: Create Food Record
      description: Create a food record in the food record table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodRecordCreateRequest'
      responses:
        '200':
          description: Food record created successfully
        '400':
          description: Validation error

  /food-record-attendent/update/:
    post:
      tags: [Reports]
      summary: Update Food Record Attendant
      description: Insert food record data into food record attendant table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodRecordAttendentUpdateRequest'
      responses:
        '200':
          description: Food record attendent created successfully
        '400':
          description: Validation error

  /food-record-attendent/list/:
    post:
      tags: [Reports]
      summary: List Food Record Attendant
      description: List food record attendant data date-wise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodRecordAttendentListRequest'
      responses:
        '200':
          description: Food records retrieved successfully
        '400':
          description: Missing required fields or invalid date format

  /reports/crechelist/:
    post:
      tags: [Reports]
      summary: Creche List
      description: List creches by tea garden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeaGardenIdRequest'
      responses:
        '200':
          description: Creches retrieved successfully
        '400':
          description: tea_garden_id is required

  /reports/healthcenterlist/:
    post:
      tags: [Reports]
      summary: Health Center List
      description: List health centers by tea garden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeaGardenIdRequest'
      responses:
        '200':
          description: Health centers retrieved successfully
        '400':
          description: tea_garden_id is required

  /reports/teagardenlist/:
    get:
      tags: [Reports]
      summary: Tea Garden List
      description: List all tea gardens
      responses:
        '200':
          description: Tea gardens retrieved successfully

  /reports/attendant-attendance/:
    post:
      tags: [Reports]
      summary: Attendant Attendance Report
      description: Get attendant attendance report for a creche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendantAttendanceReportRequest'
      responses:
        '200':
          description: Report generated successfully
        '400':
          description: Missing required fields or invalid date format
        '404':
          description: Invalid creche or tea garden

  /reports/children/:
    post:
      tags: [Reports]
      summary: Creche Child Details
      description: Get detailed information about a child in a creche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrecheChildDetailsRequest'
      responses:
        '200':
          description: Child details retrieved successfully
        '404':
          description: Creche or child not found

  /reports/attendant/details/:
    post:
      tags: [Reports]
      summary: Attendant Details
      description: Get detailed information about an attendant
